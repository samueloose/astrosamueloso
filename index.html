<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Astrofotografico Samueloso</title>
    <style>
        * { box-sizing: border-box; font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif; }
        
        body { 
            background: #020204; 
            color: #f5f5f7; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Blob Background for Liquid Glass Effect */
        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            filter: blur(80px);
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.22;
            mix-blend-mode: screen;
            animation: float 25s infinite ease-in-out;
        }
        .blob-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #0071e3 0%, rgba(0,113,227,0) 70%);
            top: -10%;
            left: 10%;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #8a2be2 0%, rgba(138,43,226,0) 70%);
            bottom: -10%;
            right: 5%;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00f2fe 0%, rgba(0,242,254,0) 70%);
            top: 35%;
            left: 45%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(60px, -90px) scale(1.15); }
            66% { transform: translate(-40px, 60px) scale(0.85); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            width: 100%; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            position: relative;
            z-index: 1;
        }
        
        h1 { 
            text-align: center; 
            font-size: 3.5rem; 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            margin-bottom: 5px; 
            margin-top: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.15;
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 400;
            color: #86868b;
            letter-spacing: -0.01em;
            margin-bottom: 50px;
            margin-top: 0;
        }
        
        /* Transition-based views */
        .view { 
            display: none; 
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .view.active { 
            display: block; 
        }
        
        /* Liquid Glass Card Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Home Screen */
        .home-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
        }
        
        .search-bar { 
            display: flex; 
            width: 100%; 
            max-width: 480px; 
            gap: 12px; 
            margin-bottom: 50px; 
            padding: 6px;
        }
        
        .search-bar input { 
            flex: 1; 
            padding: 12px 20px; 
            border: none; 
            background: transparent; 
            color: white; 
            font-size: 16px; 
            outline: none;
            font-weight: 400;
        }
        
        .search-bar input::placeholder {
            color: #86868b;
        }
        
        .search-bar button { 
            padding: 12px 24px; 
            border-radius: 18px; 
            border: none; 
            background-color: rgba(255, 255, 255, 0.9); 
            color: #000; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .search-bar button:hover { 
            background-color: #ffffff; 
            transform: scale(1.02);
        }
        
        .cols-container { 
            display: flex; 
            width: 100%; 
            gap: 30px; 
            flex-wrap: wrap; 
            margin-bottom: 50px; 
        }
        
        .col { 
            flex: 1; 
            min-width: 320px; 
            padding: 30px; 
        }
        
        .col h2 { 
            text-align: center; 
            font-size: 1.3rem; 
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #f5f5f7; 
            margin-top: 0; 
            margin-bottom: 25px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            padding-bottom: 15px; 
        }
        
        .btn-list { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .btn-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; 
        }
        
        button.menu-btn { 
            padding: 14px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            background-color: rgba(255, 255, 255, 0.03); 
            color: #f5f5f7; 
            font-weight: 500; 
            cursor: pointer; 
            font-size: 14px; 
            text-align: center; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        button.menu-btn:hover { 
            background-color: rgba(255, 255, 255, 0.12); 
            border-color: rgba(255, 255, 255, 0.2); 
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.15);
        }
        
        .bottom-bar { 
            display: flex; 
            justify-content: center; 
            margin-top: 10px; 
            margin-bottom: 40px;
        }
        
        .btn-large { 
            padding: 16px 45px; 
            font-size: 16px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            background: linear-gradient(135deg, #0071e3 0%, #0056b3 100%);
            color: white; 
            font-weight: 500; 
            cursor: pointer; 
            box-shadow: 0 8px 24px rgba(0, 113, 227, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .btn-large:hover { 
            background: linear-gradient(135deg, #0077ed 0%, #0062cc 100%);
            transform: translateY(-2px) scale(1.03); 
            box-shadow: 0 12px 30px rgba(0, 113, 227, 0.45);
        }
        
        /* Grid Screen */
        .top-navigation { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 40px; 
            flex-wrap: wrap; 
            gap: 20px; 
            padding: 15px 25px;
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        
        .top-navigation h2 { 
            margin: 0; 
            font-size: 1.6rem; 
            font-weight: 700; 
            letter-spacing: -0.02em;
        }
        
        .back-btn { 
            padding: 10px 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            background-color: rgba(255, 255, 255, 0.05); 
            color: #f5f5f7; 
            font-weight: 500; 
            cursor: pointer; 
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .back-btn:hover { 
            background-color: rgba(255, 255, 255, 0.15); 
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }
        
        .inner-search { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            max-width: 320px; 
        }
        
        .inner-search input { 
            width: 100%;
            padding: 10px 18px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background-color: rgba(0, 0, 0, 0.3); 
            color: white; 
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        
        .inner-search input:focus {
            border-color: #0071e3;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(0, 113, 227, 0.3);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
            margin-bottom: 50px;
        }
        
        .card { 
            overflow: hidden; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .card:hover { 
            transform: translateY(-6px); 
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px rgba(0, 113, 227, 0.25);
        }
        
        .card .img-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .card:hover img {
            transform: scale(1.06);
        }
        
        .card-info { 
            padding: 20px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            flex-grow: 1; 
        }
        
        .card-title { 
            font-weight: 600; 
            font-size: 1.15rem; 
            margin-bottom: 6px; 
            color: #ffffff; 
            letter-spacing: -0.01em;
        }
        
        .card-sub { 
            color: #86868b; 
            font-size: 0.9rem; 
        }
        
        .no-results { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 60px; 
            color: #86868b; 
            font-size: 1.2rem; 
        }
        
        /* Modal Detail */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.85); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            padding: 20px; 
            box-sizing: border-box; 
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-container { 
            width: 100%; 
            max-width: 900px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 30px;
        }
        
        .modal.active .modal-container {
            transform: scale(1);
        }
        
        .modal-content-wrapper {
            width: 100%;
            height: 55vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        
        .modal-content { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 16px; 
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        
        .modal-text { 
            text-align: center; 
            width: 100%; 
            max-width: 750px;
        }
        
        .modal-text h2 { 
            font-size: 2rem; 
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 0; 
            margin-bottom: 12px; 
            color: #fff; 
        }
        
        .modal-text p { 
            color: #86868b; 
            font-size: 1.05rem; 
            line-height: 1.5; 
            margin-bottom: 20px; 
            margin-top: 0;
        }
        
        .modal-text p b {
            color: #f5f5f7;
            font-weight: 500;
        }
        
        /* Navigation & actions inside modal */
        .modal-actions { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            width: 100%; 
            margin-top: 10px; 
        }
        
        .modal-nav-btn { 
            padding: 12px 28px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.08); 
            background-color: rgba(255,255,255,0.05); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #f5f5f7; 
            font-weight: 500; 
            cursor: pointer; 
            font-size: 14px; 
            min-width: 130px; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .modal-nav-btn:hover:not(:disabled) { 
            background-color: rgba(255,255,255,0.15); 
            border-color: rgba(255,255,255,0.25);
            transform: scale(1.03) translateY(-1px);
        }
        
        .modal-nav-btn:disabled { 
            background-color: rgba(0,0,0,0.3); 
            color: #444; 
            border-color: rgba(255,255,255,0.02);
            cursor: not-allowed; 
        }
        
        .close { 
            position: absolute; 
            top: -65px; 
            right: 0; 
            color: #86868b; 
            font-size: 30px; 
            cursor: pointer; 
            font-weight: 300; 
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .close:hover { 
            color: white; 
            background: rgba(255,255,255,0.15);
            transform: rotate(90deg);
        }

        /* Responsive Mobile Layout Override */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 10px 5px;
            }
            h1 {
                font-size: 2.2rem;
                margin-top: 20px;
                margin-bottom: 5px;
            }
            .subtitle {
                font-size: 1.1rem;
                margin-bottom: 30px;
            }
            .search-bar {
                max-width: 100%;
                margin-bottom: 30px;
            }
            .cols-container {
                flex-direction: column;
                gap: 20px;
                margin-bottom: 30px;
            }
            .col {
                padding: 20px;
            }
            .top-navigation {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
                gap: 15px;
                top: 10px;
                margin-bottom: 30px;
                border-radius: 20px;
            }
            .top-navigation h2 {
                text-align: center;
                font-size: 1.4rem;
            }
            .inner-search {
                max-width: 100%;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }
            .modal-container {
                padding: 15px;
                border-radius: 20px;
                max-height: 90vh;
                overflow-y: auto;
            }
            .modal-content-wrapper {
                height: 40vh;
                margin-bottom: 15px;
            }
            .modal-text h2 {
                font-size: 1.4rem;
            }
            .modal-text p {
                font-size: 0.9rem;
                margin-bottom: 15px;
            }
            .modal-actions {
                width: 100%;
                gap: 10px;
            }
            .modal-nav-btn {
                flex: 1;
                min-width: 0;
                padding: 10px 5px;
                font-size: 13px;
                border-radius: 14px;
            }
            .close {
                top: -55px;
                right: 5px;
                width: 38px;
                height: 38px;
                font-size: 24px;
            }
        }
    </style>
</head>

                <div class="cols-container">

                        </div>
                    </div>
                    
                    <!-- Colonna Categorie -->
                    <div class="col glass-panel">

                            <button class="menu-btn" onclick="apriCategoria('Galassia')">Galassia</button>

                            <button class="menu-btn" onclick="apriCategoria('Stella Doppia')">Stella Doppia</button>
                        </div>
                    </div>
                </div>
                
                <div class="bottom-bar">
                    <button class="btn-large" onclick="apriGalleria()">🖼️ Galleria Completa</button>
                </div>
            </div>
        </div>

        <!-- VISTA GRIGLIA -->
        <div id="view-grid" class="view">
            <div class="top-navigation glass-panel">
                <button class="back-btn" onclick="mostraHome()">🏠 Torna alla Home</button>
                <h2 id="gridTitle">Galleria</h2>
                <div class="inner-search">
                    <input type="text" id="innerSearchInput" placeholder="Filtra in questa vista...">
                </div>
            </div>
            <div class="grid" id="galleryGrid"></div>
        </div>
    </div>

    <!-- MODAL DETTAGLIO -->
    <div class="modal" id="detailModal" onclick="closeModal(event)">
        <div class="modal-container glass-panel">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-content-wrapper">
                <img class="modal-content" id="modalImg" src="">
            </div>
            <div class="modal-text" id="modalText"></div>
            <div class="modal-actions">
                <button class="modal-nav-btn" id="btnPrev" onclick="sfogliaModal(-1)">◀ Precedente</button>
                <button class="modal-nav-btn" id="btnNext" onclick="sfogliaModal(1)">Successivo ▶</button>
            </div>
        </div>
    </div>

        "sensore": "Nikon D3200",
        "integrazione": "1h 42'",
        "wikipedia": "",
        "immagine": "Immagini/web/risultato_finale.jpg",
        "miniatura": "Immagini/miniature/risultato_finale_thumb.jpg"
    },
    "NGC 7001": {
        "titolo": "Nebulosa Nord America",
        "cataloghi": {
            "NGC": "7000"
        },
        "categoria": "Nebulosa",
        "telescopio": "-",
        "sensore": "Nikon D3200",
        "integrazione": "5h 54'",
        "wikipedia": "https://it.wikipedia.org/wiki/Nebulosa_Nord_America",
        "immagine": "Immagini/web/deneb.jpg",
        "miniatura": "Immagini/miniature/deneb_thumb.jpg"
    }
};

        // Filtriamo solo gli elementi che hanno un'immagine salvata (figure piene)
        const albumData = Object.keys(rawData)
            .filter(key => rawData[key].immagine && rawData[key].immagine.trim() !== '')
            .sort()
            .reduce((obj, key) => {
                obj[key] = rawData[key];
                return obj;
            }, {});

        let currentFilteredKeys = [];
        let currentModalIndex = -1;

        const homeSearchInput = document.getElementById('homeSearchInput');
        const innerSearchInput = document.getElementById('innerSearchInput');

        homeSearchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') eseguiRicercaHome();
        });

        innerSearchInput.addEventListener('input', filtraGrigliaCorrente);

        function switchView(fromId, toId) {
            const fromEl = document.getElementById(fromId);
            const toEl = document.getElementById(toId);
            
            fromEl.style.opacity = '0';
            fromEl.style.transform = 'scale(0.97)';
            
            setTimeout(() => {
                fromEl.classList.remove('active');
                fromEl.style.display = 'none';
                
                toEl.style.display = 'block';
                // Forza reflow
                toEl.offsetHeight;
                toEl.classList.add('active');
                
                setTimeout(() => {
                    toEl.style.opacity = '1';
                    toEl.style.transform = 'scale(1)';
                }, 50);
            }, 400);
        }

        function mostraHome() {
            switchView('view-grid', 'view-home');
            homeSearchInput.value = '';
        }

        function mostraGriglia(titolo, chiaviSelezionate) {
            currentFilteredKeys = chiaviSelezionate;
            document.getElementById('gridTitle').textContent = titolo;
            innerSearchInput.value = '';
            
            switchView('view-home', 'view-grid');
            
            renderGrid(chiaviSelezionate);
        }

        function formatCatalogs(info, defaultId) {
            if (info.cataloghi && Object.keys(info.cataloghi).length > 0) {
                let parts = [];
                for (let c in info.cataloghi) {
                    if (info.cataloghi[c]) parts.push(c + ' ' + info.cataloghi[c]);
                }
                if (parts.length > 0) return parts.join(' / ');
            }
            return defaultId;
        }

        function renderGrid(keys) {
            const gridDiv = document.getElementById('galleryGrid');
            gridDiv.innerHTML = '';
            
            if (keys.length === 0) {
                gridDiv.innerHTML = '<div class="no-results">Nessuna foto trovata in questa sezione.</div>';
                return;
            }

            keys.forEach((key) => {
                const info = albumData[key];
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(key);

                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'img-container';

                const img = document.createElement('img');
                img.src = info.miniatura || info.immagine || '';
                img.onerror = function() { this.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="300" height="200" style="background:%23333"%3E%3Ctext x="50%25" y="50%25" fill="%23aaa" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif"%3ENessuna Immagine%3C/text%3E%3C/svg%3E'; };

                imgWrapper.appendChild(img);

                const infoDiv = document.createElement('div');
                infoDiv.className = 'card-info';

                let displayId = formatCatalogs(info, key);
                infoDiv.innerHTML = `<div class="card-title">${displayId}</div><div class="card-sub">${info.titolo || 'Senza Titolo'}</div>`;

                card.appendChild(imgWrapper);
                card.appendChild(infoDiv);
                gridDiv.appendChild(card);
            });
        }

        function filtraGrigliaCorrente() {
            const search = innerSearchInput.value.toLowerCase();
            const filtered = currentFilteredKeys.filter(key => {
                const info = albumData[key];
                const titleMatch = (info.titolo || '').toLowerCase().includes(search);
                const idMatch = key.toLowerCase().includes(search);
                const catMatch = info.cataloghi ? Object.entries(info.cataloghi).some(([c, n]) => `${c} ${n}`.toLowerCase().includes(search)) : false;
                const categoryMatch = (info.categoria || '').toLowerCase().includes(search);
                return titleMatch || idMatch || catMatch || categoryMatch;
            });
            renderGrid(filtered);
        }

        function apriCatalogo(prefisso) {
            const filteredKeys = Object.keys(albumData).filter(key => {
                const info = albumData[key];
                if (key.toUpperCase().startsWith(prefisso.toUpperCase())) return true;
                if (info.cataloghi && Object.keys(info.cataloghi).some(c => c.toUpperCase() === prefisso.toUpperCase())) return true;
                return false;
            });
            
            let nomeCatalogo = `Catalogo: ${prefisso}`;
            if (prefisso.toUpperCase() === 'M') {
                nomeCatalogo = 'Catalogo Messier';
            } else if (prefisso.toUpperCase() === 'NGC') {
                nomeCatalogo = 'Catalogo NGC';
            }
            
            mostraGriglia(nomeCatalogo, filteredKeys);
        }

        function apriCategoria(categoria) {
            const filteredKeys = Object.keys(albumData).filter(key => {
                const info = albumData[key];
                return info.categoria && info.categoria.toLowerCase() === categoria.toLowerCase();
            });
            mostraGriglia(`Categoria: ${categoria}`, filteredKeys);
        }

        function apriGalleria() {
            mostraGriglia('Galleria Completa', Object.keys(albumData));
        }

        function eseguiRicercaHome() {
            const query = homeSearchInput.value.trim().toLowerCase();
            if (!query) return;

            const keywords = query.split(' ').filter(k => k);
            const filteredKeys = Object.keys(albumData).filter(key => {
                const info = albumData[key];
                
                const searchFields = [
                    key.toLowerCase(),
                    (info.titolo || '').toLowerCase(),
                    (info.categoria || '').toLowerCase(),
                    (info.telescopio || '').toLowerCase(),
                    (info.sensore || '').toLowerCase()
                ];
                
                if (info.cataloghi) {
                    for (let c in info.cataloghi) {
                        searchFields.push(`${c} ${info.cataloghi[c]}`.toLowerCase());
                        searchFields.push(`${c}${info.cataloghi[c]}`.toLowerCase());
                    }
                }
                
                const combinedText = searchFields.join(' ');
                return keywords.every(kw => combinedText.includes(kw));
            });

            mostraGriglia(`Risultati per: "${homeSearchInput.value}"`, filteredKeys);
        }

        function openModal(key) {
            const index = currentFilteredKeys.indexOf(key);
            if (index === -1) return;

            currentModalIndex = index;
            aggiornaDettaglioModal();
            
            const modal = document.getElementById('detailModal');
            modal.style.display = 'flex';
            // Forza reflow
            modal.offsetHeight;
            modal.classList.add('active');
            
            setTimeout(() => {
                modal.style.opacity = '1';
                document.querySelector('.modal-container').style.transform = 'scale(1)';
            }, 50);
        }

        function aggiornaDettaglioModal() {
            const key = currentFilteredKeys[currentModalIndex];
            const info = albumData[key];

            const modalImg = document.getElementById('modalImg');
            const modalText = document.getElementById('modalText');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            modalImg.src = info.immagine || '';
            
            let displayId = formatCatalogs(info, key);
            let htmlText = `<h2>${displayId} - ${info.titolo || 'Senza Titolo'}</h2>
                            <p><b>Categoria:</b> ${info.categoria || '-'} | <b>Telescopio:</b> ${info.telescopio || '-'} | <b>Sensore:</b> ${info.sensore || '-'} | <b>Integrazione:</b> ${info.integrazione || '-'}</p>`;

            if (info.wikipedia) {
                htmlText += `<a href="${info.wikipedia}" target="_blank" style="color:#2f9eef; text-decoration:none; font-weight:500;">📚 Leggi su Wikipedia</a>`;
            }
            modalText.innerHTML = htmlText;

            // Aggiorna pulsanti di navigazione
            btnPrev.disabled = currentModalIndex <= 0;
            btnNext.disabled = currentModalIndex >= currentFilteredKeys.length - 1;
        }

        function sfogliaModal(direzione) {
            const nuovoIndice = currentModalIndex + direzione;
            if (nuovoIndice >= 0 && nuovoIndice < currentFilteredKeys.length) {
                const modalImg = document.getElementById('modalImg');
                // Fade out dell'immagine per una transizione fluida
                modalImg.style.opacity = '0';
                modalImg.style.transform = 'scale(0.97)';
                
                setTimeout(() => {
                    currentModalIndex = nuovoIndice;
                    aggiornaDettaglioModal();
                    
                    setTimeout(() => {
                        modalImg.style.opacity = '1';
                        modalImg.style.transform = 'scale(1)';
                    }, 50);
                }, 250);
            }
        }

        function closeModal(e) {
            if (!e || e.target.id === 'detailModal' || e.target.className === 'close') {
                const modal = document.getElementById('detailModal');
                modal.style.opacity = '0';
                document.querySelector('.modal-container').style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    modal.classList.remove('active');
                    modal.style.display = 'none';
                }, 400);
            }
        }
    </script>
</body>
</html>
